[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-data-auditor"
version = "0.1.0"
description = "Production-grade AI-powered deletion-audit and verification agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pytest>=7.0.0",
    "python-dateutil>=2.8.2",
    "pymupdf>=1.23.0",
    "Pillow>=9.0.0",
    "jsonschema>=4.0.0"
]

[project.scripts]
ghost-auditor = "ghost_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

